<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323235"/>
      <stop offset="1" stop-color="#19191a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- a clean gap around the lead face, like the ring on stacked avatars -->
    <mask id="gap">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="600" r="244" fill="#000"/>
    </mask>
  </defs>
  <!-- tile, on Apple's 1024 icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- two teammates behind -->
  <g mask="url(#gap)">
    <circle cx="292" cy="440" r="148" fill="#8b5cf6"/>
    <rect x="222" y="396" width="30" height="58" rx="15" fill="#000" fill-opacity="0.7"/>
    <rect x="268" y="396" width="30" height="58" rx="15" fill="#000" fill-opacity="0.7"/>
    <circle cx="732" cy="440" r="148" fill="#10b981"/>
    <rect x="726" y="396" width="30" height="58" rx="15" fill="#000" fill-opacity="0.7"/>
    <rect x="772" y="396" width="30" height="58" rx="15" fill="#000" fill-opacity="0.7"/>
  </g>
  <!-- the lead, in front -->
  <circle cx="512" cy="600" r="222" fill="#f59e0b"/>
  <rect x="452" y="510" width="42" height="86" rx="21" fill="#000" fill-opacity="0.7"/>
  <rect x="554" y="510" width="42" height="86" rx="21" fill="#000" fill-opacity="0.7"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
</svg>
